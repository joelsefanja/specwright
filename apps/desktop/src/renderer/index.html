<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Specwright</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        min-height: 100%;
        background: #0b0d10;
      }

      body {
        color: #f4f7fb;
      }

      #boot-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background:
          linear-gradient(180deg, rgba(13, 17, 22, 0.96), rgba(7, 9, 12, 0.98)),
          #0b0d10;
        transition: opacity 1000ms cubic-bezier(0.2, 0, 0.2, 1), visibility 1000ms cubic-bezier(0.2, 0, 0.2, 1);
      }

      .boot-card {
        width: min(420px, calc(100vw - 48px));
        border: 1px solid rgba(218, 226, 236, 0.28);
        background: #12161b;
        padding: 22px;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.44);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .boot-label {
        margin: 0 0 12px;
        color: #f2d47b;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .boot-title {
        margin: 0;
        color: #f4f7fb;
        font-size: 18px;
        font-weight: 750;
      }

      .boot-detail {
        margin: 8px 0 18px;
        color: #c0cad7;
        font-size: 13px;
        line-height: 1.45;
      }

      .boot-bar {
        height: 2px;
        overflow: hidden;
        background: #26303b;
      }

      .boot-bar::before {
        content: "";
        display: block;
        width: 42%;
        height: 100%;
        background: #e3b950;
        animation: boot-progress 1.2s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      body.app-ready #boot-screen {
        pointer-events: none;
        opacity: 0;
        visibility: hidden;
      }

      #root {
        opacity: 0;
        transition: opacity 1000ms cubic-bezier(0.2, 0, 0.2, 1);
      }

      body.app-ready #root {
        opacity: 1;
      }

      @keyframes boot-progress {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(250%); }
      }
    </style>
  </head>
  <body>
    <div id="boot-screen" aria-live="polite">
      <div class="boot-card">
        <p class="boot-label">Specwright</p>
        <p class="boot-title">Preparing workspace</p>
        <p class="boot-detail">Loading the desktop interface, project state, and local tools.</p>
        <div class="boot-bar"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
